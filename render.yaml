services:
  - type: web
    name: receiptsplit-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: uv sync --frozen --no-dev
    startCommand: uv run --no-dev alembic upgrade head && uv run --no-dev uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: RECEIPTSPLIT_ENV
        value: production
      - key: RECEIPTSPLIT_DATABASE_URL
        sync: false
      - key: RECEIPTSPLIT_DATABASE_POOL_SIZE
        value: "1"
      - key: RECEIPTSPLIT_DATABASE_MAX_OVERFLOW
        value: "0"
      - key: RECEIPTSPLIT_DATABASE_POOL_RECYCLE_SECONDS
        value: "120"
      - key: RECEIPTSPLIT_CORS_ORIGINS
        value: https://receiptsplit-web.vercel.app
      - key: RECEIPTSPLIT_AUTH_OIDC_PROVIDER
        value: disabled
      - key: RECEIPTSPLIT_OCR_PROVIDER
        value: mock
      - key: RECEIPTSPLIT_OCR_STORE_RAW_TEXT
        value: "false"
      - key: RECEIPTSPLIT_LOG_LEVEL
        value: INFO
