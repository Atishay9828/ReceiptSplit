services:
  - type: web
    name: receiptsplit-api
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: RECEIPTSPLIT_ENV
        value: production
      - key: RECEIPTSPLIT_DATABASE_URL
        sync: false
      - key: RECEIPTSPLIT_DATABASE_POOL_SIZE
        value: "1"
      - key: RECEIPTSPLIT_DATABASE_MAX_OVERFLOW
        value: "0"
      - key: RECEIPTSPLIT_DATABASE_POOL_RECYCLE_SECONDS
        value: "120"
      - key: RECEIPTSPLIT_CORS_ORIGINS
        value: https://receiptsplit-web.vercel.app
      - key: RECEIPTSPLIT_AUTH_OIDC_PROVIDER
        value: google
      - key: RECEIPTSPLIT_AUTH_OIDC_AUDIENCE
        sync: false
      - key: RECEIPTSPLIT_OCR_PROVIDER
        value: tesseract
      - key: RECEIPTSPLIT_TESSERACT_LANGUAGE
        value: eng
      - key: RECEIPTSPLIT_TESSERACT_PSM
        value: "4"
      - key: RECEIPTSPLIT_OCR_TIMEOUT_SECONDS
        value: "30"
      - key: RECEIPTSPLIT_OCR_LOCAL_STORAGE_DIR
        value: /tmp/receiptsplit-ocr
      - key: RECEIPTSPLIT_OCR_STORE_RAW_TEXT
        value: "false"
      - key: RECEIPTSPLIT_LOG_LEVEL
        value: INFO
