[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "receiptsplit-backend"
version = "0.1.0"
description = "ReceiptSplit backend — UPI-native receipt-first bill splitting"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "psycopg2-binary>=2.9.10",

    # Configuration
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",

    # Supabase (Realtime broadcasting)
    "supabase>=2.10.0",

    # Security
    "python-multipart>=0.0.12",   # for form uploads (Phase 2)

    # Utilities
    "python-dateutil>=2.9.0",
    "bleach>=6.2.0",              # HTML sanitization
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.0",              # async test client for FastAPI
    "hypothesis>=6.115.0",        # property-based testing
    "anyio>=4.6.0",               # async test primitives

    # Test database
    "testcontainers[postgres]>=4.8.0",

    # Code quality
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.vercel]
entrypoint = "app.main:app"

# ── Ruff (linting + formatting) ──────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 99
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",   # line too long — handled by formatter
    "B008",   # do not perform function calls in default args (FastAPI Depends pattern)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ── Mypy ─────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["bleach.*", "testcontainers.*"]
ignore_missing_imports = true

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--tb=short",
    "-q",
]
markers = [
    "unit: fast isolated unit tests (no DB)",
    "integration: tests requiring a live database",
    "property: hypothesis property-based tests",
    "concurrency: tests for concurrent-access correctness",
    "security: tests for authorization and access control",
]

# ── Coverage ──────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["app"]
omit = ["app/main.py", "migrations/*"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80
